<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="style.css">

    <header>LIFE EASY TOOLS</header>

            Welcome To LIFE EASY TOOLS | All-in-One Utility Platform | Developed by MRF

    <script src="script.js"></script>
